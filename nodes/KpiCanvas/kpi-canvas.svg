<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- Chart bars -->
  <rect x="6"  y="38" width="10" height="14" rx="2" fill="currentColor" opacity="0.6"/>
  <rect x="20" y="28" width="10" height="24" rx="2" fill="currentColor" opacity="0.8"/>
  <rect x="34" y="18" width="10" height="34" rx="2" fill="currentColor"/>
  <!-- Trend line -->
  <polyline
    points="11,36 25,26 39,16 52,10"
    stroke="currentColor"
